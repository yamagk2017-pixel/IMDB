name: IMDB profile workflow

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 実行する処理
        required: true
        type: choice
        default: publish
        options:
          - setup
          - publish
      max_rows:
        description: 1回に処理する最大行数
        required: true
        default: "1"
      request_id:
        description: publish時に対象を1行へ限定するrequest_id
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: imdb-profile-workflow
  cancel-in-progress: false

jobs:
  setup:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'setup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - name: Initialize workflow sheet
        run: npm run profile:sheet:setup
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_WORKFLOW_SPREADSHEET_ID: ${{ secrets.GOOGLE_WORKFLOW_SPREADSHEET_ID }}
          GOOGLE_WORKFLOW_SHEET_NAME: ${{ vars.GOOGLE_WORKFLOW_SHEET_NAME }}

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - name: Publish approved rows
        run: npm run profile:publish -- --apply --max-rows=${{ inputs.max_rows || '1' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          GOOGLE_WORKFLOW_SPREADSHEET_ID: ${{ secrets.GOOGLE_WORKFLOW_SPREADSHEET_ID }}
          GOOGLE_WORKFLOW_SHEET_NAME: ${{ vars.GOOGLE_WORKFLOW_SHEET_NAME }}
          GOOGLE_MASTER_SHEET_NAME: ${{ vars.GOOGLE_MASTER_SHEET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROFILE_WORKFLOW_REQUEST_ID: ${{ inputs.request_id }}
          PROFILE_WORKFLOW_REQUIRE_REQUEST_ID: "true"
